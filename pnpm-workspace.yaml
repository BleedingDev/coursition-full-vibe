packages:
  - .

minimumReleaseAge: 0
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1440
blockExoticSubdeps: true
engineStrict: true
pmOnFail: error
verifyDepsBeforeRun: error
strictDepBuilds: true

peerDependencyRules:
  allowedVersions:
    # Zephyr asks for `@modern-js/app-tools: ^3.0.0`. The UltraModern fork is
    # installed under an alias at a prerelease version, which semver ranges
    # never match, so the peer has to be allowed explicitly.
    '@modern-js/app-tools': '3.5.0-ultramodern.98'
    react: '>=19.0.0'
    typescript: '7.0.2'

allowBuilds:
  '@ax-llm/ax': false
  '@swc/core': true
  core-js: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true

overrides:
  '@effect/opentelemetry': 4.0.0-beta.94
  '@effect/platform-node-shared': 4.0.0-beta.94
  '@effect/vitest': 4.0.0-beta.94
  effect: 4.0.0-beta.94
  kysely: 0.28.17
  postcss: 8.5.18
  tailwindcss-animate: npm:tw-animate-css@^1.4.0

patchedDependencies:
  '@ax-llm/ax@22.0.2': patches/@ax-llm__ax@22.0.2.patch
  '@bleedingdev/modern-js-app-tools@3.5.0-ultramodern.98': patches/@bleedingdev__modern-js-app-tools@3.5.0-ultramodern.98.patch
  '@bleedingdev/modern-js-plugin-i18n@3.5.0-ultramodern.98': patches/@bleedingdev__modern-js-plugin-i18n@3.5.0-ultramodern.98.patch
  '@bleedingdev/modern-js-plugin-tanstack@3.5.0-ultramodern.98': patches/@bleedingdev__modern-js-plugin-tanstack@3.5.0-ultramodern.98.patch
  '@bleedingdev/modern-js-utils@3.5.0-ultramodern.98': patches/@bleedingdev__modern-js-utils@3.5.0-ultramodern.98.patch
  react-helmet-async@3.0.0: patches/react-helmet-async@3.0.0.patch
